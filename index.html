<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriBalance</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #F2FBF6; color: #0A2E22; font-family: -apple-system, sans-serif; padding-bottom: 30px; }
    </style>
</head>
<body class="p-3 max-w-md mx-auto text-xs">
    <div class="text-center mb-2">
        <h1 class="text-base font-bold text-emerald-800">🥗 NutriBalance</h1>
    </div>
    
    <!-- Параметры -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-emerald-100 mb-2">
        <div class="grid grid-cols-3 gap-1.5 mb-2">
            <div>
                <label class="text-[10px] text-gray-500">Вес (кг)</label>
                <input type="number" id="w" value="83" class="w-full p-1.5 border rounded-lg bg-gray-50 text-xs">
            </div>
            <div>
                <label class="text-[10px] text-gray-500">Рост</label>
                <input type="number" id="h" value="183" class="w-full p-1.5 border rounded-lg bg-gray-50 text-xs">
            </div>
            <div>
                <label class="text-[10px] text-gray-500">Возраст</label>
                <input type="number" id="a" value="43" class="w-full p-1.5 border rounded-lg bg-gray-50 text-xs">
            </div>
        </div>
        <div class="mb-2">
            <label class="text-[10px] text-gray-500">Цель</label>
            <select id="goal" class="w-full p-1.5 border rounded-lg bg-gray-50 text-xs">
                <option value="-15">Снижение (-15%)</option>
                <option value="0" selected>Поддержание</option>
                <option value="15">Набор (+15%)</option>
            </select>
        </div>
        <button onclick="calc()" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-medium text-xs">Рассчитать норму</button>
    </div>

    <!-- Результаты КБЖУ -->
    <div id="res" class="bg-emerald-50 p-2.5 rounded-xl border border-emerald-200 mb-2 text-center">
        <span class="font-bold text-emerald-900 text-sm" id="kcal">2425 ккал в день</span>
        <div id="mac" class="text-[11px] text-emerald-800 mt-0.5">Белки: 149г | Жиры: 81г | Углеводы: 275г</div>
    </div>

    <!-- Трекер еды -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-emerald-100 mb-2">
        <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-emerald-900">🍽️ Учет еды</span>
            <span id="foodTotal" class="text-emerald-700 font-semibold">0 / 2425 ккал</span>
        </div>
        <div class="flex gap-1.5 mb-2">
            <input type="text" id="foodName" placeholder="Название блюда" class="flex-2 p-1.5 border rounded-lg bg-gray-50 text-xs">
            <input type="number" id="foodKcal" placeholder="Ккал" class="flex-1 p-1.5 border rounded-lg bg-gray-50 text-xs">
            <button onclick="addFood()" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-medium text-xs">+</button>
        </div>
        <div id="foodList" class="space-y-1 max-h-28 overflow-y-auto text-[11px]">
            <!-- Список блюд -->
        </div>
    </div>

    <!-- Вода -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-emerald-100 mb-2">
        <div class="flex justify-between items-center mb-1.5">
            <span class="font-bold text-emerald-900">💧 Вода</span>
            <span id="wCount" class="text-emerald-700 font-semibold">0.00 / 2.5 л</span>
        </div>
        <div class="flex gap-1 mb-2" id="waterGlasses"></div>
        <button onclick="addW()" class="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 py-1.5 rounded-lg font-medium text-xs">+ Стакан (250 мл)</button>
    </div>

    <!-- Витамины -->
    <div class="bg-white p-3 rounded-xl shadow-sm border border-emerald-100">
        <h3 class="font-bold text-emerald-900 mb-2">💊 Базовый набор витаминов</h3>
        <div class="space-y-1.5 text-[11px]">
            <div class="flex justify-between p-1.5 bg-emerald-50/50 rounded-lg">
                <span class="font-medium text-emerald-900">Витамин D3</span>
                <span class="text-emerald-700">2000 МЕ (утром)</span>
            </div>
            <div class="flex justify-between p-1.5 bg-emerald-50/50 rounded-lg">
                <span class="font-medium text-emerald-900">Омега-3</span>
                <span class="text-emerald-700">1000 мг (с едой)</span>
            </div>
            <div class="flex justify-between p-1.5 bg-emerald-50/50 rounded-lg">
                <span class="font-medium text-emerald-900">Магний (глицинат)</span>
                <span class="text-emerald-700">400 мг (вечером)</span>
            </div>
        </div>
    </div>

    <script>
        if (window.Telegram?.WebApp) { window.Telegram.WebApp.ready(); window.Telegram.WebApp.expand(); }

        let water = parseInt(localStorage.getItem('nutri_water')) || 0;
        let foodItems = JSON.parse(localStorage.getItem('nutri_food')) || [];
        let currentTargetKcal = 2425;

        if(localStorage.getItem('nutri_w')) document.getElementById('w').value = localStorage.getItem('nutri_w');
        if(localStorage.getItem('nutri_h')) document.getElementById('h').value = localStorage.getItem('nutri_h');
        if(localStorage.getItem('nutri_a')) document.getElementById('a').value = localStorage.getItem('nutri_a');
        if(localStorage.getItem('nutri_goal')) document.getElementById('goal').value = localStorage.getItem('nutri_goal');

        function renderWater() {
            const container = document.getElementById('waterGlasses');
            container.innerHTML = '';
            for (let i = 0; i < 10; i++) {
                const g = document.createElement('div');
                g.className = `flex-1 h-5 rounded ${i < water ? 'bg-emerald-500' : 'bg-emerald-100'}`;
                container.appendChild(g);
            }
            document.getElementById('wCount').innerText = `${(water * 0.25).toFixed(2)} / 2.5 л`;
        }

        function addW() {
            if(water < 10) { 
                water++; 
                localStorage.setItem('nutri_water', water);
                renderWater(); 
            }
        }

        function renderFood() {
            const list = document.getElementById('foodList');
            list.innerHTML = '';
            let totalEaten = 0;
            foodItems.forEach((item, index) => {
                totalEaten += item.kcal;
                const div = document.createElement('div');
                div.className = 'flex justify-between items-center p-1 bg-gray-50 rounded-lg';
                div.innerHTML = `<span>${item.name}</span><div class="flex items-center gap-2"><span class="font-semibold text-emerald-800">${item.kcal} ккал</span><button onclick="removeFood(${index})" class="text-red-400 font-bold px-1">×</button></div>`;
                list.appendChild(div);
            });
            document.getElementById('foodTotal').innerText = `${totalEaten} / ${currentTargetKcal} ккал`;
            localStorage.setItem('nutri_food', JSON.stringify(foodItems));
        }

        function addFood() {
            const nameInput = document.getElementById('foodName');
            const kcalInput = document.getElementById('foodKcal');
            const name = nameInput.value.trim();
            const kcal = parseInt(kcalInput.value);
            if (name && !isNaN(kcal)) {
                foodItems.push({ name, kcal });
                nameInput.value = '';
                kcalInput.value = '';
                renderFood();
            }
        }

        function removeFood(index) {
            foodItems.splice(index, 1);
            renderFood();
        }

        function calc() {
            let w = parseFloat(document.getElementById('w').value) || 75;
            let h = parseFloat(document.getElementById('h').value) || 175;
            let a = parseInt(document.getElementById('a').value) || 35;
            let g = parseFloat(document.getElementById('goal').value) || 0;

            localStorage.setItem('nutri_w', w);
            localStorage.setItem('nutri_h', h);
            localStorage.setItem('nutri_a', a);
            localStorage.setItem('nutri_goal', g);

            currentTargetKcal = Math.round(((10 * w) + (6.25 * h) - (5 * a) + 5) * 1.375 * (1 + g/100));
            let p = Math.round(w * 1.8), f = Math.round((currentTargetKcal * 0.3)/9), c = Math.round((currentTargetKcal - p*4 - f*9)/4);
            
            document.getElementById('kcal').innerText = currentTargetKcal + ' ккал в день';
            document.getElementById('mac').innerText = `Белки: ${p}г | Жиры: ${f}г | Углеводы: ${c}г`;
            document.getElementById('res').classList.remove('hidden');
            renderFood();
        }

        renderWater();
        calc();
    </script>
</body>
</html>
