<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriBalance Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-mint: #F2FBF6; --card-bg: #FFFFFF; --border-mint: #D1F2DF;
            --emerald-main: #0F9F6E; --text-dark: #0A2E22; --text-muted: #4A6B5D;
        }
        .dark {
            --bg-mint: #0E1F18; --card-bg: #142E24; --border-mint: #1E4637;
            --emerald-main: #10B981; --text-dark: #E2F8EE; --text-muted: #8FAEA2;
        }
        body { background-color: var(--bg-mint); color: var(--text-dark); font-family: -apple-system, sans-serif; padding-bottom: 70px; transition: background 0.3s, color 0.3s; }
        .app-card { background-color: var(--card-bg); border-color: var(--border-mint); }
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Круговой прогресс */
        .ring-bg { stroke: var(--border-mint); }
        .ring-fill { stroke: var(--emerald-main); transition: stroke-dashoffset 0.5s ease-out; }
    </style>
</head>
<body class="p-3 max-w-md mx-auto text-xs">
    <!-- Шапка -->
    <div class="flex justify-between items-center mb-3">
        <div>
            <h1 class="text-base font-bold text-emerald-600 dark:text-emerald-400">🥗 NutriBalance</h1>
            <p class="text-[11px] text-[var(--text-muted)]">Умный трекер здоровья</p>
        </div>
        <button onclick="toggleTheme(); haptic('light');" class="px-2.5 py-1.5 rounded-xl border border-[var(--border-mint)] app-card font-medium text-[var(--text-dark)]">🌙 Тон</button>
    </div>

    <!-- ВКЛАДКА 1: ГЛАВНАЯ -->
    <div id="tab-home" class="tab-content active space-y-3">
        <div id="smartTip" class="app-card p-2.5 rounded-2xl border text-[11px] font-medium text-emerald-700 dark:text-emerald-300 bg-emerald-50/50 dark:bg-emerald-950/30"></div>

        <div class="app-card p-3 rounded-2xl border shadow-sm">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-sm text-[var(--text-dark)]">📊 Прогресс за день</h2>
                <span id="homeFoodTotal" class="text-xs font-bold text-emerald-600 dark:text-emerald-400">0 / 0 ккал</span>
            </div>
            
            <div class="flex items-center justify-center mb-4 relative">
                <svg width="120" height="120" class="transform -rotate-90">
                    <circle cx="60" cy="60" r="50" stroke-width="8" fill="none" class="ring-bg"></circle>
                    <circle id="kcalRing" cx="60" cy="60" r="50" stroke-width="8" fill="none" stroke-linecap="round" class="ring-fill" stroke-dasharray="314" stroke-dashoffset="314"></circle>
                </svg>
                <div class="absolute flex flex-col items-center">
                    <span id="ringKcalEaten" class="text-lg font-extrabold text-[var(--text-dark)]">0</span>
                    <span class="text-[10px] text-[var(--text-muted)]">ккал съедено</span>
                </div>
            </div>

            <div class="space-y-2">
                <div>
                    <div class="flex justify-between text-[10px] mb-1"><span class="text-[var(--text-muted)]">Белки (оценка)</span><span id="pText" class="font-medium text-[var(--text-dark)]">0 / 0 г</span></div>
                    <div class="h-1.5 w-full bg-emerald-50 dark:bg-emerald-900/30 rounded-full overflow-hidden"><div id="pBar" class="h-full bg-emerald-500 transition-all duration-500" style="width: 0%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[10px] mb-1"><span class="text-[var(--text-muted)]">Жиры (оценка)</span><span id="fText" class="font-medium text-[var(--text-dark)]">0 / 0 г</span></div>
                    <div class="h-1.5 w-full bg-emerald-50 dark:bg-emerald-900/30 rounded-full overflow-hidden"><div id="fBar" class="h-full bg-emerald-500 transition-all duration-500" style="width: 0%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[10px] mb-1"><span class="text-[var(--text-muted)]">Углеводы (оценка)</span><span id="cText" class="font-medium text-[var(--text-dark)]">0 / 0 г</span></div>
                    <div class="h-1.5 w-full bg-emerald-50 dark:bg-emerald-900/30 rounded-full overflow-hidden"><div id="cBar" class="h-full bg-emerald-500 transition-all duration-500" style="width: 0%"></div></div>
                </div>
            </div>
        </div>

        <div class="app-card p-3 rounded-2xl border shadow-sm">
            <h2 class="font-bold text-sm mb-2 text-[var(--text-dark)]">👤 Ваши параметры</h2>
            <div class="grid grid-cols-3 gap-1.5 mb-2">
                <input type="number" id="w" placeholder="Вес (кг)" onchange="calc()" class="w-full p-1.5 border border-[var(--border-mint)] rounded-xl bg-emerald-50/20 dark:bg-emerald-900/10 text-xs text-[var(--text-dark)]">
                <input type="number" id="h" placeholder="Рост (см)" onchange="calc()" class="w-full p-1.5 border border-[var(--border-mint)] rounded-xl bg-emerald-50/20 dark:bg-emerald-900/10 text-xs text-[var(--text-dark)]">
                <input type="number" id="a" placeholder="Возраст" onchange="calc()" class="w-full p-1.5 border border-[var(--border-mint)] rounded-xl bg-emerald-50/20 dark:bg-emerald-900/10 text-xs text-[var(--text-dark)]">
            </div>
            <select id="goal" onchange="calc()" class="w-full p-1.5 border border-[var(--border-mint)] rounded-xl bg-emerald-50/20 dark:bg-emerald-900/10 text-xs text-[var(--text-dark)]">
                <option value="-15">Снижение (-15%)</option>
                <option value="0">Поддержание веса</option>
                <option value="15">Набор массы (+15%)</option>
            </select>
        </div>
    </div>

    <!-- ВКЛАДКА 2: ДНЕВНИК -->
    <div id="tab-food" class="tab-content space-y-3">
        <div class="app-card p-3 rounded-2xl border shadow-sm">
            <h2 class="font-bold text-sm mb-2 text-[var(--text-dark)]">➕ Добавить прием пищи</h2>
            
            <select id="foodCategory" class="w-full p-1.5 border border-[var(--border-mint)] rounded-xl bg-emerald-50/20 dark:bg-emerald-900/10 text-xs mb-1.5 text-[var(--text-dark)]">
                <option value="Завтрак">🍳 Завтрак</option>
                <option value="Обед">🍲 Обед</option>
                <option value="Ужин">🍽️ Ужин</option>
                <option value="Перекус">🍎 Перекус</option>
            </select>

            <select id="foodPreset" onchange="handlePreset()" class="w-full p-1.5 border border-[var(--border-mint)] rounded-xl bg-emerald-50/20 dark:bg-emerald-900/10 text-xs mb-1.5 text-[var(--text-dark)]">
                <option value="">-- Выберите из базы (или введите вручную) --</option>
                <optgroup label="Базовые продукты">
                    <option value="Овсяная каша на воде|70">Овсяная каша (70 ккал/100г)</option>
                    <option value="Куриная грудка отвар
